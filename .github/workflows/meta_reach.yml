name: Meta reach check
on: { workflow_dispatch: {} }
jobs:
  reach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env: { META_TOKEN: "${{ secrets.META_TOKEN }}" }
        run: python meta_reach.py
