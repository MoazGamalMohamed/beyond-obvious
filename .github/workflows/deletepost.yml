name: Delete a scheduled reel (one-off cleanup)
on:
  workflow_dispatch: {}
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Delete duplicate scheduled reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python deletepost.py
