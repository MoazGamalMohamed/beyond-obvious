name: Generate songs on Kaggle GPU - Idiom Zoo

# Idiom Zoo ONLY. Generates the sung tracks for IZ-003..007 on Kaggle's FREE GPU
# by running the ACE-Step v1.5 XL-Turbo code of the victor/ace-step-jam Space
# (the same model behind Break the Ice / IZ-001 / IZ-002). No ZeroGPU quota is
# used. Output WAVs are committed to songs_idiomzoo/, which the render container
# then aligns + masters + renders. The ZeroGPU path (gen_all.py) stays as fallback.
#
# Requires repo secrets: KAGGLE_USERNAME, KAGGLE_KEY (HF_TOKEN optional).

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: pip install --quiet kaggle six
      - name: Check Kaggle auth secrets are present (prints only true/false, never values)
        env:
          HAS_TOKEN: ${{ secrets.KAGGLE_API_TOKEN != '' }}
          HAS_USER_SECRET: ${{ secrets.KAGGLE_USERNAME != '' }}
          HAS_USER_VAR: ${{ vars.KAGGLE_USERNAME != '' }}
          HAS_KEY: ${{ secrets.KAGGLE_KEY != '' }}
        run: |
          echo "KAGGLE_API_TOKEN present as repo SECRET  : $HAS_TOKEN"
          echo "KAGGLE_USERNAME  present as repo SECRET  : $HAS_USER_SECRET"
          echo "KAGGLE_USERNAME  present as repo VARIABLE: $HAS_USER_VAR"
          echo "KAGGLE_KEY       present as repo SECRET  : $HAS_KEY"
      - name: Generate songs on Kaggle GPU
        env:
          # NEW Kaggle auth: single access token (KGAT_...). Keep as a Secret.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          # Username is not sensitive (Secret or Variable); needed to name the kernel.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
          # Legacy fallback (only if an old username+key pair is used instead).
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python gen_kaggle_iz.py
      - name: Commit generated songs
        run: |
          git config user.name "idiomzoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add songs_idiomzoo/*.wav 2>/dev/null || true
          git commit -m "idiomzoo: Kaggle-generated songs" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
