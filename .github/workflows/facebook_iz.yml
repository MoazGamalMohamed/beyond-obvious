name: Facebook Reel - Idiom Zoo

# Idiom Zoo ONLY. META_PAGE_ID pins the Idiom Zoo Page (1494526067076336), so
# resolve() uses the Idiom Zoo Page token. Cannot post to Beyond Obvious or
# What If Lab.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Schedule Idiom Zoo Facebook Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: "1494526067076336"
          SCHEDULE_FILE: "schedule_idiomzoo_meta.json"
          STATE_FILE: "state_idiomzoo_fb.json"
          VIDEOS_DIR: "videos_idiomzoo"
          # Schedule each reel natively at its publishAt (one dispatch queues the
          # whole week, one idiom per day). Launch-day immediate publish is done
          # with fb_publish_one.yml, not here.
          FB_PUBLISH_NOW: "0"
        run: python post_facebook.py
      - name: Save state
        run: |
          git config user.name "idiomzoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_idiomzoo_fb.json || true
          git commit -m "idiomzoo facebook state" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
