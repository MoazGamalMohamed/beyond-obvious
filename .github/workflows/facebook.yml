name: Facebook Reels (weekly schedule)

on:
  schedule:
    - cron: "17 15 * * 1"   # Mondays ~15:17 UTC
  workflow_dispatch: {}      # allow manual run

permissions:
  contents: write            # to commit the state file back

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Schedule this week's Facebook Reels
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python post_facebook.py
      - name: Save state
        run: |
          git config user.name "beyond-obvious-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_fb.json || true
          git commit -m "update facebook state" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
