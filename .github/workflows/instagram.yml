name: Instagram Reel (daily)

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC daily = 6:00 PM America/Chicago (CST)
    - cron: "0 12 * * *"     # 2nd daily pass (12:00 UTC) so the day's Reel still posts if the 00:00 run fires late
  workflow_dispatch: {}       # allow manual run

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish today's Instagram Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          CATCHUP: "1"
        run: python post_instagram.py
      - name: Save state
        run: |
          git config user.name "beyond-obvious-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_ig.json || true
          git commit -m "update instagram state" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
