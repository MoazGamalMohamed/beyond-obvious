name: Instagram Reel (daily)

on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC daily = 6:00 PM America/Chicago (CST)
    - cron: "0 12 * * *"     # 2nd daily pass (12:00 UTC) so the day's Reel still posts if the 00:00 run fires late
  workflow_dispatch: {}       # allow manual run

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish today's Instagram Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python post_instagram.py
      - name: Save state
        run: |
          git config user.name "beyond-obvious-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_ig.json || true
          git commit -m "update instagram state" || echo "no changes"
          git push || echo "nothing to push"
