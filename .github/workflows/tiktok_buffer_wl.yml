name: What If Lab — TikTok via Buffer

# What If Lab's own TikTok is connected in Buffer (channel "whatiflabmoaz").
# Its Buffer channel id is pinned below. A Buffer channel id is an object id, not
# a credential, so it is safe to keep in the repo and it makes the target channel
# auditable: this job can only ever post to What If Lab, never to the Beyond
# Obvious TikTok. REQUIRE_CHANNEL_ID=1 is kept as a guard — if the id were ever
# removed the script refuses to auto-pick a channel rather than risk the wrong one.
# BUFFER_API_KEY stays a secret. Buffer pre-schedules each short and publishes it
# at its slot on its own, so the daily cron only needs to hand over new/upcoming
# videos; it is idempotent via state_buffer_wl.json (no double-posting).
on:
  schedule:
    - cron: "30 20 * * *"   # daily 20:30 UTC — hand upcoming What If Lab shorts to Buffer
  workflow_dispatch:
    inputs:
      mode:
        description: "check = list Buffer channels (posts nothing) | validate | post = hand shorts to Buffer"
        required: true
        default: "check"
        type: choice
        options: [check, validate, post]

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: What If Lab TikTok via Buffer
        env:
          # Scheduled (cron) runs have no input and default to 'post'; a manual
          # "Run workflow" click defaults to the safe 'check' via the input above.
          MODE: ${{ inputs.mode || 'post' }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_TIKTOK_CHANNEL_ID: "6b061b9c8541f09ecb92ed0c"   # Buffer channel "whatiflabmoaz"
          REQUIRE_CHANNEL_ID: "1"
          SCHEDULE_FILE: schedule_whatiflab.json
          STATE_FILE: state_buffer_wl.json
          CONFIG_FILE: tiktok_auto_wl.json
          GH_REPO: ${{ github.repository }}
        run: python buffer_tiktok.py
      - name: Save state
        run: |
          git config user.name "whatiflab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_buffer_wl.json || true
          git commit -m "update what if lab buffer state" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
