name: Fill out Page profile (About/Description)
on:
  workflow_dispatch: {}
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set Facebook Page About + Description
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python updateprofile.py
