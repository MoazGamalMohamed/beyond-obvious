name: Long-form teasers -> Instagram + TikTok

# Posts the ~58s 9:16 teaser of each long-form video to that brand's OWN
# Instagram (Reel) and TikTok (via Buffer). Runs when pushed to the working
# branch. Idempotent via longform_social_state.json.

on:
  push:
    branches: [claude/project-thread-sj3iu8]
    paths:
      - "longform_social.py"
      - ".github/workflows/longform_social.yml"
      - "longform_teasers/**"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Post teasers to Instagram + TikTok
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BO_TT_CHANNEL: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
          GH_REPO: ${{ github.repository }}
        run: python longform_social.py
      - name: Save state
        run: |
          git config user.name "studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add longform_social_state.json || true
          git commit -m "longform teaser state" || echo "no changes"
          git push || echo "nothing to push"
