name: Check Meta connection (no posting)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve Page + Instagram from token
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python check_meta.py
      - name: List already-published posts (read-only)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python list_posts.py
