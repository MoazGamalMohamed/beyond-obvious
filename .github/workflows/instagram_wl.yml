name: What If Lab — Instagram Reel (daily)

on:
  schedule:
    - cron: "0 21 * * *"     # 21:00 UTC daily = 3:00 PM America/Chicago
    - cron: "0 9 * * *"      # 2nd daily pass (09:00 UTC) to catch the prior day's slot if the 21:00 run fired late
  workflow_dispatch: {}       # allow manual run

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish today's What If Lab Instagram Reel
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_PAGE_ID: "1484071088120232"
          SCHEDULE_FILE: schedule_whatiflab.json
          STATE_FILE: state_ig_wl.json
          # IG fetches the Reel from GitHub Pages (docs/) as video/mp4 instead of
          # the resumable byte upload, which hit ProcessingFailedError. WL videos
          # are published to docs/ alongside the repo videos/ copy.
          VIDEO_BASE_URL: "https://moazgamalmohamed.github.io/beyond-obvious"
          # Self-heal: post the oldest not-yet-posted WL slot (catches up a day
          # whose run failed, e.g. WL-003 on Nov 27).
          CATCHUP: "1"
        run: python post_instagram.py
      - name: Save state
        run: |
          git config user.name "whatiflab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_ig_wl.json || true
          git commit -m "update what if lab instagram state" || echo "no changes"
          pushed=0
          for __i in 1 2 3 4 5 6; do
            git fetch -q --deepen=50 origin main 2>/dev/null || git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main; then pushed=1; echo "state pushed (try $__i)"; break; fi
            echo "push race; retry $__i"; sleep $(( (RANDOM % 4) + 2 ))
          done
          [ "$pushed" = 1 ] || { echo "ERROR: state push failed after retries"; exit 1; }
